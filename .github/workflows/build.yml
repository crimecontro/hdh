name: Build exe and apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build PCGuard.exe
        working-directory: agent
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --onefile --noconsole --name PCGuard --collect-all pycaw --collect-all comtypes agent.py
      - uses: actions/upload-artifact@v4
        with:
          name: PCGuard-windows-exe
          path: agent/dist/PCGuard.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PCGuard-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
